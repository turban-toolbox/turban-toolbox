[project]
name = "turban-toolbox"
dynamic = ["version"]
description = "Turbulence Analysis Toolbox"
authors = [
  { name = "Achim Randelhoff", email = "ara@akvaplan.niva.no" },
  { name = "Peter Holtermann", email = "peter.holtermann@io-warnemuende.de" },
  { name = "Lucas Merckelbach", email = "lucas.merckelbach@hereon.de" },  
]
license = { text = "GPLv03" }
dependencies = [
  'beartype>=0.18',
  'gsw>=3.6.18',
  'jaxtyping>=0.2.20',
  'matplotlib>=3.8.4',
  'netCDF4>=1.7.0',
  'numba>=0.60',
  'numpy>=2.0',
  'pandas>=2.2.2',
  'pydantic>=2.0',
  'requests>=2.32.0',
  'scipy>=1.13',
  'setuptools>=65',
  'xarray>=2024.10.0',
]

requires-python = ">=3.12"
readme = "README.md"
classifiers = [
  'Development Status :: 4 - Beta',
  'Topic :: Scientific/Engineering',
  'Intended Audience :: Science/Research',
  'License :: OSI Approved :: GNU General Public License v3 (GPLv3)',
  'Operating System :: OS Independent',
  'Programming Language :: Python :: 3 :: Only',
]

[project.optional-dependencies]
mss = ["pytz>=2020.1", "dateparser>=1.2.0"]
microrider = ["arrow>=1.4.0"]

[dependency-groups]
dev = [
    "turban-toolbox[mss,microrider]",
    "black>=25.11.0",
    "ipython>=8.18.1",
    "mypy>=1.19.1",
    "pytest>=8.4.2",
    "pytest-cov>=6.0",
    "mkdocs>=1.6",
    "mkdocs-material>=9.0",
    "pytest-markdown-docs>=0.6",
    "pymdown-extensions>=10.8",
    "mkdocstrings[python]>=0.24",
    "scipy-stubs>=1.17.1.5",
]

[project.scripts]
turban_download_datafiles="turban.utils.cli:download_datafiles"

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]

[tool.setuptools_scm]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.pytest.ini_options]
filterwarnings = "always::UserWarning"
addopts = "--markdown-docs --markdown-docs-syntax=superfences"
log_cli = false
log_cli_level = "WARNING"

[tool.black]
line-length = 88
target-version = ['py311', 'py312', 'py313', 'py314']
include = '\.pyi?$'
exclude = '''

(
  /(
    | \.ipynb_checkpoints
    | \.pytest_cache
    | __pycache__
  )/
)

'''
[tool.mypy]
python_version = "3.13"
strict = true  # Enable all checks
disallow_untyped_calls = true


